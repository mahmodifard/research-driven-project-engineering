    - "researching"
    - "blocked"
    - "ready"
    - "in_progress"
    - "implemented"
    - "deferred"
  evidence_result:
    - "not_run"
    - "pass"
    - "fail"
    - "partial"
    - "not_applicable"
    - "blocked"
  evidence_lane:
    - "source_build"
    - "contract"
    - "automated_test"
    - "integration_sandbox"
    - "runtime_path"
    - "consumer_acceptance"
    - "release"
  gate_decision:
    - "pending"
    - "pass"
    - "conditional"
    - "blocked"
  delivery_decision:
    - "go"
    - "conditional"
    - "no_go"
  capability_delivery:
    - "planned"
    - "designed"
    - "implemented"
  capability_verification:
    - "unverified"
    - "pass"
    - "fail"
    - "partial"
  capability_release:
    - "not_eligible"
    - "eligible"
